      - name: Build one unsigned release only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stage107"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > diagnostic/local.properties
          curl -fLsS --retry 2 --max-time 120 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/15246489482/zip" -o previous.zip
          echo '81a605ab4848ccd5f7d6e53a9aa7b196606da8b32a815c15da703765788cd90c  previous.zip' | sha256sum -c -
          mkdir -p diagnostic/gradle
          unzip -p previous.zip verification-metadata.xml > diagnostic/gradle/verification-metadata.xml
          echo '02b0ce8a46c1cc2a71f7e520fda6aea48f735f167c4d00df2c7e35a2a0e5469e  diagnostic/gradle/verification-metadata.xml' | sha256sum -c -
          unzip -p previous.zip dependencies.sha256 > evidence/stage96-dependencies.sha256
          rm previous.zip
          "$JAVA_HOME/bin/java" -version 2>&1 | tee evidence/java-version.txt
          tools/gradle-7.5.1/bin/gradle --version | tee evidence/gradle-version.txt
          tools/gradle-7.5.1/bin/gradle -p diagnostic --no-daemon --console=plain --stacktrace --dependency-verification strict "-PdiagnosticPython=$PWD/tools/python/bin/python3.10" assembleRelease 2>&1 | tee evidence/build.log
          mapfile -t apks < <(find diagnostic/build/outputs/apk/release -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" evidence/FFBE-Isolated-Diagnostic106-UNSIGNED.apk
          cp diagnostic/gradle/verification-metadata.xml evidence/verification-metadata.xml
          echo '02b0ce8a46c1cc2a71f7e520fda6aea48f735f167c4d00df2c7e35a2a0e5469e  evidence/verification-metadata.xml' | sha256sum -c -
      - name: Inspect APK without signing or running
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stage107"
          apk="$PWD/evidence/FFBE-Isolated-Diagnostic106-UNSIGNED.apk"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging "$apk" > evidence/badging.txt
          "$bt/aapt" dump permissions "$apk" > evidence/permissions.txt
          "$bt/aapt" dump xmltree "$apk" AndroidManifest.xml > evidence/manifest-tree.txt
          grep -F "package: name='org.ffbe.diagnostic106'" evidence/badging.txt
          grep -Fx "sdkVersion:'26'" evidence/badging.txt
          grep -Fx "targetSdkVersion:'33'" evidence/badging.txt
          ! grep -E 'uses-permission|permission:' evidence/permissions.txt
          "$bt/zipalign" -c -v 4 "$apk" > evidence/zipalign.txt
          if "$bt/apksigner" verify --verbose "$apk" > evidence/unsigned-check.txt 2>&1; then echo 'Unexpected signed output'; exit 1; fi
          grep -E 'DOES NOT VERIFY|Missing META-INF/MANIFEST.MF|No signatures' evidence/unsigned-check.txt
          python3 - "$apk" <<'PY'
          import sys,zipfile,io,hashlib,json,struct
          z=zipfile.ZipFile(sys.argv[1]); names=z.namelist()
          assert len(names)==len(set(names)) and z.testzip() is None
          libs=[n for n in names if n.startswith('lib/') and n.endswith('.so')]
          assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs)
          assert not any('libgame' in n.lower() or 'exvius' in n.lower() for n in names)
          assert not any(n.upper().startswith('META-INF/') and n.upper().endswith(('.RSA','.DSA','.EC','.SF')) for n in names)
          for n in libs:
              b=z.read(n); assert b[:4]==b'\x7fELF' and b[4:6]==b'\x02\x01' and struct.unpack_from('<H',b,18)[0]==183
          app=zipfile.ZipFile(io.BytesIO(z.read('assets/chaquopy/app.imy')))
          modules={'coordinator88','first_write87','managed106','managed89','no_loss87','serializer106','strict87'}
          assert app.testzip() is None
          assert len(app.namelist())==len(modules) and {n.removesuffix('.pyc').removesuffix('.py') for n in app.namelist()}==modules,app.namelist()
          assert all(n.endswith(('.py','.pyc')) and '/' not in n for n in app.namelist()),app.namelist()
          with open('evidence/apk-inventory.json','w') as f: json.dump({'members':{n:hashlib.sha256(z.read(n)).hexdigest() for n in names},'app_imy':app.namelist(),'native':libs},f,indent=2)
          PY
          sha256sum evidence/FFBE-Isolated-Diagnostic106-UNSIGNED.apk > evidence/apk.sha256
          find diagnostic/build/intermediates/merged_manifests -name AndroidManifest.xml -type f -exec cp {} evidence/merged-manifest.xml \;
          test -f evidence/merged-manifest.xml
          echo VERIFIED_UNSIGNED_DIAGNOSTIC_ONLY | tee evidence/outcome.txt
      - name: Preserve dependency and build records
        if: always()
        shell: bash
        run: |
          set -eu
          cd "$RUNNER_TEMP/stage107"
          if [ -d gradle-home/caches/modules-2/files-2.1 ]; then
            (cd gradle-home/caches/modules-2/files-2.1 && find . -type f -print0 | sort -z | xargs -0 -r sha256sum) > evidence/dependencies.sha256
          fi
          if [ -f diagnostic/gradle/verification-metadata.xml ]; then cp diagnostic/gradle/verification-metadata.xml evidence/verification-metadata.xml; fi
          find diagnostic -type f -not -path '*/.gradle/*' -not -path '*/build/*' -not -name local.properties | sort > evidence/source-files.txt
          git --version > evidence/runner-tool-version.txt
          if [ -f evidence/outcome.txt ]; then
            tar -czf evidence/reusable-intermediates.tar.gz -C diagnostic build/intermediates/javac build/outputs
          fi
      - name: Align and sign one isolated diagnostic with ephemeral key
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stage107"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          unsigned="$PWD/evidence/FFBE-Isolated-Diagnostic106-UNSIGNED.apk"
          signed="$PWD/evidence/FFBE-Isolated-Diagnostic106-SIGNED.apk"
          "$bt/zipalign" -P 16 -v 4 "$unsigned" aligned.apk > evidence/align16.log
          keydir="$(mktemp -d)"
          chmod 700 "$keydir"
          trap 'rm -rf "$keydir"; unset DIAG_PASS' EXIT
          DIAG_PASS="$(openssl rand -hex 32)"
          echo "::add-mask::$DIAG_PASS"
          export DIAG_PASS
          "$JAVA_HOME/bin/keytool" -genkeypair -alias diagnostic107 -keystore "$keydir/key.p12" -storetype PKCS12 -storepass:env DIAG_PASS -keypass:env DIAG_PASS -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=FFBE isolated diagnostic 107' > evidence/key-generation.log 2>&1
          "$bt/apksigner" sign --ks "$keydir/key.p12" --ks-key-alias diagnostic107 --ks-pass env:DIAG_PASS --key-pass env:DIAG_PASS --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out "$signed" aligned.apk
          "$bt/apksigner" verify --verbose --print-certs "$signed" > evidence/signed-cert.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' evidence/signed-cert.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' evidence/signed-cert.txt
          grep -Fx 'Number of signers: 1' evidence/signed-cert.txt
          ! grep -F 'f8be4d016081278f120faa30d80218da9c3edc52b538cfcaddb1bf0d82977654' evidence/signed-cert.txt
          ! grep -F '0f759675d0b98456b5d22ff9a395b55f022abd403033370d97e87fc40d3060e4' evidence/signed-cert.txt
          ! grep -F 'db2e515c590e06f25abe1020b5cdeb229e09edf4706c83af5173df276608a5b6' evidence/signed-cert.txt
          ! grep -F '4c5af9481f1fe2a93db1b5c1086fbeb55a31fef109f455630a78600232f4f57d' evidence/signed-cert.txt
          "$bt/zipalign" -c -P 4 -v 4 "$signed" > evidence/signed-align4.txt
          "$bt/zipalign" -c -P 16 -v 4 "$signed" > evidence/signed-align16.txt
          python3 - "$unsigned" "$signed" <<'PY'
          import zipfile,sys,hashlib,json
          a,b=map(zipfile.ZipFile,sys.argv[1:])
          assert a.testzip() is None and b.testzip() is None and a.namelist()==b.namelist()
          assert all(a.read(n)==b.read(n) and a.getinfo(n).compress_type==b.getinfo(n).compress_type for n in a.namelist())
          print("All original APK members unchanged by alignment/signing")
          PY
          "$bt/aapt" dump badging "$signed" > evidence/signed-badging.txt
          grep -F "package: name='org.ffbe.diagnostic106'" evidence/signed-badging.txt
          "$bt/aapt" dump permissions "$signed" > evidence/signed-permissions.txt
          ! grep -E 'uses-permission|permission:' evidence/signed-permissions.txt
          sha256sum "$signed" > evidence/signed-apk.sha256
          cp "$signed" diagnostic.apk
          rm -f aligned.apk
      - name: Prepare disposable API35 emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$CLOUD_ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/stage107"
          uname -m > evidence/host.txt
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdk="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$sdk"
          export PATH="$(dirname "$sdk"):$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          (yes || true) | sdkmanager --licenses > evidence/licenses.log 2>&1
          timeout 600 sdkmanager "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" > evidence/sdk-image.log 2>&1
          test -x "$ANDROID_HOME/emulator/emulator"
          "$ANDROID_HOME/emulator/emulator" -accel-check | tee evidence/accel.txt
          sudo apt-get update > evidence/host-dependencies.log 2>&1
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libxrender1 libxfixes3 libxext6 libxcb1 libgl1 libegl1 libasound2t64 libdbus-1-3 libfontconfig1 libxkbcommon0 >> evidence/host-dependencies.log 2>&1
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" > evidence/qemu-ldd.txt
          "$ANDROID_HOME/emulator/emulator" -version > evidence/emulator-version.txt 2>&1
          cat "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties" > evidence/system-image.txt
          export ANDROID_USER_HOME="$RUNNER_TEMP/stage107/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          unset ANDROID_SDK_HOME ANDROID_EMULATOR_HOME
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n stage107 -k "system-images;android-35;google_apis;x86_64" -p "$ANDROID_AVD_HOME/stage107.avd" --force > evidence/avd.log 2>&1
          find "$ANDROID_USER_HOME" -maxdepth 4 -name 'stage107*' -print > evidence/avd-paths.txt
          if [ -d "$HOME/.android" ]; then
            find "$HOME/.android" -maxdepth 4 -name 'stage107*' -print >> evidence/avd-paths.txt
          fi
          test -s "$ANDROID_AVD_HOME/stage107.avd/config.ini"
          if [ ! -s "$ANDROID_AVD_HOME/stage107.ini" ]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/stage107.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME/stage107.avd" > "$ANDROID_AVD_HOME/stage107.ini"
          fi
          cat "$ANDROID_AVD_HOME/stage107.ini" > evidence/avd-ini.txt
          emulator -list-avds | tee evidence/avd-list.txt
          grep -Fx stage107 evidence/avd-list.txt
          adb start-server
          nohup emulator -avd stage107 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -accel on -gpu swiftshader_indirect -memory 3072 > evidence/emulator.log 2>&1 &
          emu_pid=$!
          for n in $(seq 1 90); do
            kill -0 "$emu_pid" || { cat evidence/emulator.log; exit 1; }
            if adb devices | grep -qE '^emulator-[0-9]+[[:space:]]+device'; then break; fi
            sleep 2
          done
          adb devices | tee evidence/adb-devices.txt
          grep -qE '^emulator-[0-9]+[[:space:]]+device' evidence/adb-devices.txt
          for n in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell getprop ro.build.version.sdk | tee evidence/api.txt
          adb shell getprop ro.product.cpu.abilist | tee evidence/abi.txt
          adb shell getprop ro.dalvik.vm.native.bridge | tee evidence/native-bridge.txt
          adb shell getprop ro.build.fingerprint > evidence/fingerprint.txt
          grep -F 'arm64-v8a' evidence/abi.txt
          adb shell input keyevent 82
          adb shell wm size 1080x1920
          adb shell wm density 320
      - name: Execute exact diagnostic UI once
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stage107"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          if adb shell pm list packages org.ffbe.diagnostic106 | grep -Fx 'package:org.ffbe.diagnostic106'; then echo 'Unexpected preexisting diagnostic'; exit 1; fi
          adb install diagnostic.apk | tee evidence/install.txt
          grep -Fx Success evidence/install.txt
          adb shell am start -W -n org.ffbe.diagnostic106/org.ffbe.diagnostic95.DiagnosticActivity | tee evidence/start.txt
          python3 - <<'PY'
          import subprocess as sp, time, re, xml.etree.ElementTree as E, pathlib
          p=pathlib.Path('evidence')
          def adb(*a):return sp.check_output(['adb',*a],timeout=30)
          def dump():
              adb('shell','uiautomator','dump','/sdcard/stage107-window.xml')
              raw=adb('exec-out','cat','/sdcard/stage107-window.xml')
              return raw,E.fromstring(raw)
          def capture(label,raw):
              (p/(label+'.xml')).write_bytes(raw)
              (p/(label+'.png')).write_bytes(adb('exec-out','screencap','-p'))
          launcher_dialogs=0
          def wait(text,label=None,seconds=75,expected_fault=False):
              global launcher_dialogs
              until=time.monotonic()+seconds
              while time.monotonic()<until:
                  try: raw,root=dump()
                  except (sp.SubprocessError,E.ParseError):time.sleep(2);continue
                  nodes=list(root.iter('node'))
                  values=[x.get('text','') for x in nodes]
                  alerts=[x for x in nodes if x.get('resource-id')=='android:id/alertTitle' and x.get('package')=='android']
                  if alerts:
                      title=alerts[0].get('text','')
                      if title=="Pixel Launcher isn't responding":
                          launcher_dialogs+=1
                          capture('launcher-anr-'+str(launcher_dialogs),raw)
                          if launcher_dialogs>2:raise RuntimeError('Repeated launcher ANR')
                          close=[x for x in nodes if x.get('resource-id')=='android:id/aerr_close' and x.get('package')=='android' and x.get('text')=='Close app' and x.get('enabled')=='true']
                          assert len(close)==1
                          a,b,c,d=map(int,re.findall(r'\d+',close[0].get('bounds','')))
                          adb('shell','input','tap',str((a+c)//2),str((b+d)//2))
                          time.sleep(2)
                          continue
                      if "isn't responding" in title or "keeps stopping" in title:
                          capture('unexpected-system-error',raw)
                          raise RuntimeError('Unexpected Android error dialog: '+title)
                  if any('Diagnostic BLOCKED' in t or 'Preparation blocked' in t or 'Busy or previous uncertain' in t for t in values):
                      report='\n'.join(t for t in values if t)
                      if expected_fault:
                          required=['Expected verification fault: committed fixture retained, gate blocked, external lock still excluded PASS','Diagnostic BLOCKED; fixture retained. No production implication.','phase=post-commit-failure-retained','exception=InjectedVerificationFailure','campaign=AFTER','later-writes/00000001/original.json=true','later-writes/00000001/intent.json=true','later-writes/00000001/proposed.tmp=false','later-writes/00000001/committed.json=true','files/LKCBK.dat=false']
                          if all(s in report for s in required):
                              capture(label or 'expected-fault',raw)
                              (p/'fault-report.txt').write_text(report)
                              print(report,flush=True)
                              return root
                      capture('blocked',raw)
                      (p/'unexpected-blocked-report.txt').write_text(report)
                      print(report,flush=True)
                      raise RuntimeError('Observed unexpected diagnostic BLOCKED')
                  if any(text.lower() in t.lower() for t in values):
                      if label:capture(label,raw)
                      return root
                  time.sleep(2)
              try:capture('timeout-'+(label or 'button'),raw)
              except Exception:pass
              raise RuntimeError('Timed out awaiting '+text)
          def tap(text):
              root=wait(text)
              matches=[x for x in root.iter('node') if x.get('text','').casefold()==text.casefold() and x.get('enabled')=='true']
              assert len(matches)==1,(text,len(matches))
              a,b,c,d=map(int,re.findall(r'\d+',matches[0].get('bounds','')))
              adb('shell','input','tap',str((a+c)//2),str((b+d)//2))
          wait('No probe has run.','00-initial')
          tap('Review synthetic save')
          wait('Gil: 8 -> 9','01-review')
          tap('Cancel')
          wait('Consent cancelled; no transaction.','02-cancel')
          tap('Review synthetic save')
          wait('Synthetic diagnostic review')
          # Real background lifecycle through Settings, not the unstable launcher.
          adb('shell','am','start','-W','-a','android.settings.SETTINGS')
          time.sleep(3)
          raw,root=dump()
          assert any(n.get('package')=='com.android.settings' for n in root.iter('node')), 'Settings did not reach foreground'
          capture('03-settings-foreground',raw)
          adb('shell','am','start','-W','-n','org.ffbe.diagnostic106/org.ffbe.diagnostic95.DiagnosticActivity')
          tap('Refresh report')
          wait('Consent cancelled by lifecycle; no transaction.','03-background')
          tap('Test stale review rejection')
          wait('Synthetic diagnostic review')
          tap('Confirm')
          wait('Stale review denied PASS; no transaction.','04-stale')
          tap('Review synthetic save')
          wait('Gil: 8 -> 9')
          tap('Confirm')
          root=wait('Managed writer diagnostic PASS (fixture only)','05-normal',seconds=150)
          report='\n'.join(x.get('text','') for x in root.iter('node') if x.get('text',''))
          (p/'report.txt').write_text(report)
          expected=['External lock exclusion before write PASS','Stage89 ManagedWriter no-change, commit and independent Stage93B-style witness PASS','Cross-thread Python write refused; preference mode0660 retained PASS','External lock exclusion after write PASS','External lock reacquisition after drain PASS','Managed writer diagnostic PASS (fixture only)']
          assert all(s in report for s in expected),report
          (p/'normal-outcome.txt').write_text('MANAGED WRITER NORMAL FIXTURE PASS\n')
          tap('Test post-commit verification failure')
          wait('Fixture fault test: retain commit evidence and block further requests.','06-fault-review')
          tap('Confirm')
          wait('Diagnostic BLOCKED; fixture retained. No production implication.','07-expected-fault',seconds=150,expected_fault=True)
          (p/'outcome.txt').write_text('CLOUD MANAGED WRITER NORMAL PASS AND EXPECTED POSTCOMMIT FAULT PASS — isolated fixture, not actual game acceptance\n')
          PY
      - name: Preserve actual logs and screenshots
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/stage107"
          if "$ANDROID_HOME/platform-tools/adb" devices | grep -q 'emulator-.*device'; then
            "$ANDROID_HOME/platform-tools/adb" logcat -d -t 2000 > evidence/logcat.txt || true
            "$ANDROID_HOME/platform-tools/adb" logcat -d -s FFBEDiagnostic100:I > evidence/diagnostic-phases.txt || true
            "$ANDROID_HOME/platform-tools/adb" exec-out screencap -p > evidence/last-screen.png || true
          fi
      - name: Upload only cloud diagnostic observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage107-managed-writer-build-cloud-evidence
          path: ${{ runner.temp }}/stage107/evidence
          if-no-files-found: error
          retention-days: 14
