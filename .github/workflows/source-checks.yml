name: Source-only checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-source:
    name: Public-source safety and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit public tracked paths and history
        run: python scripts/check_public_tree.py --history

      - name: Parse imported Python without executing game code
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d source ]]; then
            python -m compileall -q source
            echo "Python source parsed"
          else
            echo "Bootstrap branch: no upstream source imported"
          fi

      - name: Parse imported JavaScript without executing game code
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d source ]]; then
            while IFS= read -r -d '' file; do
              node --check "$file"
            done < <(find source -type f \( -name '*.js' -o -name '*.cjs' \) -print0)
            echo "JavaScript source parsed"
          else
            echo "Bootstrap branch: no upstream source imported"
          fi

      - name: No APK builds or distributable artifacts
        run: echo "Static source-only validation completed; no APK build or release attempted."
