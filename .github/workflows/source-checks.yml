name: Source-only checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-source:
    name: Public-source safety and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit public tracked paths and history
        run: python scripts/check_public_tree.py --history

      - name: Parse imported Python without executing game code
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d source ]]; then
            python -m compileall -q source
            echo "Python source parsed"
          else
            echo "Bootstrap branch: no upstream source imported"
          fi

      - name: Parse imported JavaScript without executing game code
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d source ]]; then
            while IFS= read -r -d '' file; do
              node --check "$file"
            done < <(find source -type f \( -name '*.js' -o -name '*.cjs' \) -print0)
            echo "JavaScript source parsed"
          else
            echo "Bootstrap branch: no upstream source imported"
          fi

      - name: Run isolated original source-only JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/test_mission_repeat.js ]]; then
            node source/exvius/test_mission_repeat.js
            node source/exvius/test_repeat_stop_policy.js
            node source/exvius/test_repeat_observation_guard.js
            node source/exvius/test_home_carousel.js
            node source/exvius/test_android_display.js
          else
            echo "Bootstrap branch: original JS tests unavailable"
          fi

      - name: Run synthetic repeat-reward and save-reload Python tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/tests/test_repeat.py && -f source/exvius/tests/test_upstream_repeat.py ]]; then
            python -m unittest discover -s source/exvius/tests -p 'test_repeat.py' -v
            python -m unittest discover -s source/exvius/tests -p 'test_upstream_repeat.py' -v
          else
            echo "Bootstrap branch: original source-only Python fixtures unavailable"
          fi

      - name: Verify read-only unit roster QoL with synthetic units
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/tests/test_unit_roster_view.py ]]; then
            python -m unittest discover -s source/exvius/tests -p 'test_unit_roster_view.py' -v
          else
            echo "Bootstrap branch: optional unit roster prototype unavailable"
          fi

      - name: Verify read-only party preset preview with synthetic decks
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/tests/test_party_preset_preview.py ]]; then
            python -m unittest discover -s source/exvius/tests -p 'test_party_preset_preview.py' -v
          else
            echo "Bootstrap branch: optional party preset preview unavailable"
          fi

      - name: Verify read-only bulk fusion selection with synthetic units
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/tests/test_bulk_fusion_preview.py ]]; then
            python -m unittest discover -s source/exvius/tests -p 'test_bulk_fusion_preview.py' -v
          else
            echo "Bootstrap branch: optional bulk fusion preview unavailable"
          fi

      - name: Test ephemeral source-only quest favorites
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/tests/test_quest_favorites_view.py ]]; then
            python -m unittest discover -s source/exvius/tests -p 'test_quest_favorites_view.py' -v
          else
            echo "Bootstrap branch: optional quest favorites prototype unavailable"
          fi

      - name: Verify read-only settled challenge reward summaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/tests/test_reward_receipt_summary.py ]]; then
            python -m unittest discover -s source/exvius/tests -p 'test_reward_receipt_summary.py' -v
          else
            echo "Bootstrap branch: optional reward summary preview unavailable"
          fi

      - name: Verify pure default-1x EXP and earned-gil preview
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/tests/test_progression_multiplier_preview.py ]]; then
            python -m unittest discover -s source/exvius/tests -p 'test_progression_multiplier_preview.py' -v
          else
            echo "Bootstrap branch: optional earning multiplier preview unavailable"
          fi

      - name: Verify hypothetical default-1x normal-drop preview
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/tests/test_drop_rate_preview.py ]]; then
            python -m unittest discover -s source/exvius/tests -p 'test_drop_rate_preview.py' -v
          else
            echo "Bootstrap branch: optional drop-rate preview unavailable"
          fi

      - name: Exercise standalone read-only QoL CLI with synthetic stdin
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/tests/test_qol_preview_cli.py ]]; then
            python -m unittest discover -s source/exvius/tests -p 'test_qol_preview_cli.py' -v
          else
            echo "Bootstrap branch: optional QoL CLI unavailable"
          fi

      - name: No APK builds or distributable artifacts
        run: echo "Safe syntax and source-only regression checks completed; no APK build or release attempted."
