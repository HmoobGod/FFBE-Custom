name: Source-only checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-source:
    name: Public-source safety and syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit public tracked paths and history
        run: python scripts/check_public_tree.py --history

      - name: Parse imported Python without executing game code
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d source ]]; then
            python -m compileall -q source
            echo "Python source parsed"
          else
            echo "Bootstrap branch: no upstream source imported"
          fi

      - name: Parse imported JavaScript without executing game code
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d source ]]; then
            while IFS= read -r -d '' file; do
              node --check "$file"
            done < <(find source -type f \( -name '*.js' -o -name '*.cjs' \) -print0)
            echo "JavaScript source parsed"
          else
            echo "Bootstrap branch: no upstream source imported"
          fi

      - name: Run isolated original source-only JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/test_mission_repeat.js ]]; then
            node source/exvius/test_mission_repeat.js
            node source/exvius/test_home_carousel.js
            node source/exvius/test_android_display.js
          else
            echo "Bootstrap branch: original JS tests unavailable"
          fi

      - name: Run synthetic repeat-reward and save-reload Python tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/exvius/tests/test_repeat.py && -f source/exvius/tests/test_upstream_repeat.py ]]; then
            python -m unittest discover -s source/exvius/tests -p 'test_repeat.py' -v
            python -m unittest discover -s source/exvius/tests -p 'test_upstream_repeat.py' -v
          else
            echo "Bootstrap branch: original source-only Python fixtures unavailable"
          fi

      - name: No APK builds or distributable artifacts
        run: echo "Safe syntax and source-only regression checks completed; no APK build or release attempted."
