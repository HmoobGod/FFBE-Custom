name: Stage99 exact diagnostic cloud test
on:
  push:
    branches: [stage99-cloud-diagnostic]
    paths: ['.github/workflows/stage99-cloud-diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
