      - name: Prepare disposable API35 emulator
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stage99"
          uname -m > evidence/host.txt
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdk="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$sdk"
          export PATH="$(dirname "$sdk"):$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          (yes || true) | sdkmanager --licenses > evidence/licenses.log 2>&1
          timeout 600 sdkmanager "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" > evidence/sdk-image.log 2>&1
          test -x "$ANDROID_HOME/emulator/emulator"
          "$ANDROID_HOME/emulator/emulator" -accel-check | tee evidence/accel.txt
          sudo apt-get update > evidence/host-dependencies.log 2>&1
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libxrender1 libxfixes3 libxext6 libxcb1 libgl1 libegl1 libasound2t64 libdbus-1-3 libfontconfig1 libxkbcommon0 >> evidence/host-dependencies.log 2>&1
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" > evidence/qemu-ldd.txt
          "$ANDROID_HOME/emulator/emulator" -version > evidence/emulator-version.txt 2>&1
          cat "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties" > evidence/system-image.txt
          export ANDROID_USER_HOME="$RUNNER_TEMP/stage99/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          unset ANDROID_SDK_HOME ANDROID_EMULATOR_HOME
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd -n stage99 -k "system-images;android-35;google_apis;x86_64" -p "$ANDROID_AVD_HOME/stage99.avd" --force > evidence/avd.log 2>&1
          find "$ANDROID_USER_HOME" -maxdepth 4 -name 'stage99*' -print > evidence/avd-paths.txt
          if [ -d "$HOME/.android" ]; then
            find "$HOME/.android" -maxdepth 4 -name 'stage99*' -print >> evidence/avd-paths.txt
          fi
          test -s "$ANDROID_AVD_HOME/stage99.avd/config.ini"
          if [ ! -s "$ANDROID_AVD_HOME/stage99.ini" ]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=avd/stage99.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME/stage99.avd" > "$ANDROID_AVD_HOME/stage99.ini"
          fi
          cat "$ANDROID_AVD_HOME/stage99.ini" > evidence/avd-ini.txt
          emulator -list-avds | tee evidence/avd-list.txt
          grep -Fx stage99 evidence/avd-list.txt
          adb start-server
          nohup emulator -avd stage99 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -accel on -gpu swiftshader_indirect -memory 3072 > evidence/emulator.log 2>&1 &
          emu_pid=$!
          for n in $(seq 1 90); do
            kill -0 "$emu_pid" || { cat evidence/emulator.log; exit 1; }
            if adb devices | grep -qE '^emulator-[0-9]+[[:space:]]+device'; then break; fi
            sleep 2
          done
          adb devices | tee evidence/adb-devices.txt
          grep -qE '^emulator-[0-9]+[[:space:]]+device' evidence/adb-devices.txt
          for n in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell getprop ro.build.version.sdk | tee evidence/api.txt
          adb shell getprop ro.product.cpu.abilist | tee evidence/abi.txt
          adb shell getprop ro.dalvik.vm.native.bridge | tee evidence/native-bridge.txt
          adb shell getprop ro.build.fingerprint > evidence/fingerprint.txt
          grep -F 'arm64-v8a' evidence/abi.txt
          adb shell input keyevent 82
          adb shell wm size 1080x1920
          adb shell wm density 320
      - name: Execute exact diagnostic UI once
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stage99"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          if adb shell pm list packages org.ffbe.diagnostic95 | grep -Fx 'package:org.ffbe.diagnostic95'; then echo 'Unexpected preexisting diagnostic'; exit 1; fi
          adb install diagnostic.apk | tee evidence/install.txt
          grep -Fx Success evidence/install.txt
          adb shell am start -W -n org.ffbe.diagnostic95/.DiagnosticActivity | tee evidence/start.txt
          python3 - <<'PY'
          import subprocess as sp, time, re, xml.etree.ElementTree as E, pathlib
          p=pathlib.Path('evidence')
          def adb(*a):return sp.check_output(['adb',*a],timeout=30)
          def dump():
              adb('shell','uiautomator','dump','/sdcard/stage99-window.xml')
              raw=adb('exec-out','cat','/sdcard/stage99-window.xml')
              return raw,E.fromstring(raw)
          def capture(label,raw):
              (p/(label+'.xml')).write_bytes(raw)
              (p/(label+'.png')).write_bytes(adb('exec-out','screencap','-p'))
          def wait(text,label=None,seconds=40):
              until=time.monotonic()+seconds
              while time.monotonic()<until:
                  try: raw,root=dump()
                  except (sp.SubprocessError,E.ParseError):time.sleep(2);continue
                  values=[x.get('text','') for x in root.iter('node')]
                  if any('Diagnostic BLOCKED' in t or 'Preparation blocked' in t or 'Busy or previous uncertain' in t for t in values):
                      capture('blocked',raw);raise RuntimeError('Observed diagnostic BLOCKED')
                  if any(text.lower() in t.lower() for t in values):
                      if label:capture(label,raw)
                      return root
                  time.sleep(2)
              try:capture('timeout-'+(label or 'button'),raw)
              except Exception:pass
              raise RuntimeError('Timed out awaiting '+text)
          def tap(text):
              root=wait(text)
              matches=[x for x in root.iter('node') if x.get('text','').casefold()==text.casefold() and x.get('enabled')=='true']
              assert len(matches)==1,(text,len(matches))
              a,b,c,d=map(int,re.findall(r'\d+',matches[0].get('bounds','')))
              adb('shell','input','tap',str((a+c)//2),str((b+d)//2))
          tap('Review synthetic save')
          wait('Gil: 8 -> 9','01-review')
          tap('Cancel')
          wait('Consent cancelled; no transaction.','02-cancel')
          tap('Review synthetic save')
          wait('Synthetic diagnostic review')
          adb('shell','input','keyevent','3')
          time.sleep(3)
          adb('shell','am','start','-W','-n','org.ffbe.diagnostic95/.DiagnosticActivity')
          tap('Refresh report')
          wait('Consent cancelled','03-background')
          tap('Test stale review rejection')
          wait('Synthetic diagnostic review')
          tap('Confirm')
          wait('Stale review denied PASS; no transaction.','04-stale')
          tap('Review synthetic save')
          wait('Gil: 8 -> 9')
          tap('Confirm')
          root=wait('Diagnostic PASS (synthetic only)','05-final',seconds=150)
          report='\n'.join(x.get('text','') for x in root.iter('node') if x.get('text',''))
          (p/'report.txt').write_text(report)
          expected=['External lock exclusion before write','Preference XML/queue/24 writes PASS','Chaquopy same-process callbacks, bytes/map and independent commit witness PASS','External lock exclusion after write','Final preference and absent keychain witness','External lock reacquisition after drain','Diagnostic PASS (synthetic only)']
          assert all(s.lower() in report.lower() for s in expected),report
          (p/'outcome.txt').write_text('CLOUD SYNTHETIC DIAGNOSTIC PASS — ARM translation, not physical-device/game acceptance\n')
          PY
      - name: Preserve actual logs and screenshots
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/stage99"
          if "$ANDROID_HOME/platform-tools/adb" devices | grep -q 'emulator-.*device'; then
            "$ANDROID_HOME/platform-tools/adb" logcat -d -t 2000 > evidence/logcat.txt || true
            "$ANDROID_HOME/platform-tools/adb" exec-out screencap -p > evidence/last-screen.png || true
          fi
      - name: Upload only cloud diagnostic observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage99-cloud-diagnostic-evidence
          path: ${{ runner.temp }}/stage99/evidence
          if-no-files-found: error
          retention-days: 14
