name: Import permitted upstream source (one time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-permitted-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffbe-pinned-source-import
  cancel-in-progress: false

jobs:
  import-source:
    name: Pinned, source-only Git history import
    if: github.repository == 'HmoobGod/FFBE-Custom'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout public bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install a pinned Git history filter
        run: python -m pip install --disable-pip-version-check "git-filter-repo==2.47.0"

      - name: Filter, inspect, parse, and import public source-only history
        shell: bash
        run: bash scripts/import_permitted_source.sh

      - name: Explicitly exclude APK packaging and release
        run: echo "Only filtered source history and branches can be published by this workflow."
